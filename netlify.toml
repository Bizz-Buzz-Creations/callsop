[build.environment]
# The MongoDB driver and the API need a current Node version.
NODE_VERSION = "22"

[[edge_functions]]
path = "/*"
function = "ip-filter"

# The MCQ test API (netlify/functions/api.mjs). This rule must stay ABOVE the
# catch-all redirect below, because Netlify uses the first rule that matches.
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api"
status = 200
force = true

[[redirects]]
from = "/*"
to = "https://callsop.bbcfinsrv.com/:splat"
status = 301
force = true
