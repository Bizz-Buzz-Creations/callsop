[build]
command = "npm run build"
publish = "dist"

[build.environment]
# The MongoDB driver and the API need a current Node version.
NODE_VERSION = "22"

[[edge_functions]]
path = "/*"
function = "ip-filter"

# The MCQ test API (netlify/functions/api.mjs). This rule must stay ABOVE the
# catch-all below, because Netlify uses the first rule that matches. :splat keeps
# the rest of the path (/api/health -> /.netlify/functions/api/health).
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
